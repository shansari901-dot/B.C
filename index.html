<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>कमेटी खाता</title>
<meta name="description" content="आपकी कमेटी • आपका हिसाब • सुरक्षित ऑनलाइन">
<meta name="theme-color" content="#5b2be0">
<style>
:root { --primary: #5b2be0; --primary-dark: #4a22c0; --accent: #7c4dff; --bg: #f3f0ff; --card: #ffffff; --text: #1a1d2e; --muted: #6b7280; --border: #e4e0f5; --success: #10b981; --danger: #ef4444; --warn-bg: #fef2f2; --ok-bg: #ecfdf5; --radius: 16px; --shadow: 0 4px 20px rgba(91,43,224,.10); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 85px; }
.topbar { background: linear-gradient(135deg, #5b2be0 0%, #7c4dff 50%, #00b4d8 100%); color: #fff; padding: 20px 18px 24px; border-radius: 0 0 28px 28px; box-shadow: 0 8px 24px rgba(91,43,224,.3); }
.topbar h1 { font-size: 24px; font-weight: 700; }
.topbar p { font-size: 13px; opacity: 0.9; margin-top: 4px; }
main { max-width: 480px; margin: 0 auto; padding: 16px 14px 20px; }
.card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid rgba(91,43,224,.06); }
.card h2 { font-size: 17px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; color: #3b1a9e; }
.card p { font-size: 14px; color: var(--muted); line-height: 1.5; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; }
input, select { width: 100%; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--border); font-size: 15px; background: #faf8ff; color: var(--text); transition: border .2s; }
input:focus, select:focus { outline: none; border-color: var(--primary); background: #fff; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: transform .12s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-secondary { background: #ede9fe; color: var(--primary); }
.btn-demo { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; }
.btn-sm { padding: 10px 14px; font-size: 13px; width: auto; }
.btn-row { display: flex; gap: 10px; margin-top: 12px; }
.auth-wrap { max-width: 400px; margin: 24px auto 0; }
.tabs { display: flex; background: #ede9fe; border-radius: 12px; padding: 4px; margin-bottom: 16px; }
.tabs button { flex: 1; padding: 10px; border: none; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; }
.tabs button.active { background: #fff; color: var(--primary); box-shadow: 0 2px 8px rgba(91,43,224,.12); }
.msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; text-align: center; }
.msg.err { background: var(--warn-bg); color: var(--danger); }
.msg.ok { background: var(--ok-bg); color: #047857; }
.user-bar { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px; box-shadow: var(--shadow); font-size: 14px; }
.user-bar span { color: var(--primary); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.stat { background: #f5f3ff; border-radius: 12px; padding: 12px 8px; text-align: center; }
.stat b { display: block; font-size: 18px; color: var(--primary); font-weight: 700; }
.stat span { font-size: 11px; color: var(--muted); }
.member { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; background: #faf8ff; flex-wrap: wrap; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
.tag.paid { background: #d1fae5; color: #047857; }
.tag.due { background: #fee2e2; color: #b91c1c; }
.code { font-size: 22px; font-weight: 800; letter-spacing: 3px; background: #f5f3ff; color: var(--primary); padding: 14px; border-radius: 12px; text-align: center; margin: 10px 0; }
.warn { background: var(--warn-bg); border: 1px solid #fecaca; padding: 14px; border-radius: 12px; margin-bottom: 10px; font-size: 14px; }
.ok { background: var(--ok-bg); border: 1px solid #a7f3d0; padding: 14px; border-radius: 12px; font-size: 14px; color: #047857; }
.small { font-size: 12px; color: var(--muted); }
.hidden { display: none !important; }
.link-btn { background: none; border: none; color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline; padding: 8px 0; width: auto; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; z-index: 50; }
.bottom-nav button { flex: 1; background: none; border: none; padding: 6px 2px; font-size: 10px; font-weight: 600; color: var(--muted); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 12px; }
.bottom-nav button .ico { font-size: 20px; }
.bottom-nav button.active { color: var(--primary); background: #f5f3ff; }
.mem-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.mem-row .num { width: 28px; height: 28px; border-radius: 50%; background: #ede9fe; color: var(--primary); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.mem-row input { flex: 1; margin: 0; padding: 10px 12px; }
.bc-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 10px; background: #faf8ff; cursor: pointer; gap: 10px; }
.empty-state { text-align: center; padding: 28px 16px; color: var(--muted); font-size: 14px; }
.modal-bg { position: fixed; inset: 0; background: rgba(30, 20, 60, 0.55); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.modal-box { background: #fff; border-radius: 18px; padding: 22px 20px; max-width: 340px; width: 100%; text-align: center; }
.modal-box p { font-size: 15px; margin-bottom: 18px; }
</style>
</head>
<body>

<div id="appModal" class="modal-bg hidden">
  <div class="modal-box">
    <p id="modalText"></p>
    <div class="btn-row" id="modalBtns"></div>
  </div>
</div>

<div class="topbar">
  <h1>💰 कमेटी खाता</h1>
  <p>आपकी कमेटी • आपका हिसाब • सुरक्षित</p>
</div>

<main>
  <!-- AUTH -->
  <section id="auth">
    <div class="auth-wrap">
      <div class="card">
        <h2 style="justify-content:center">🔐 सुरक्षित प्रवेश</h2>
        <div class="tabs" id="authTabs">
          <button id="tabReg" class="active" onclick="switchAuth('register')">नया अकाउंट</button>
          <button id="tabLogin" onclick="switchAuth('login')">लॉगिन</button>
        </div>
        <div id="authMsg"></div>

        <div id="authNormal">
          <div class="field">
            <label>मोबाइल नंबर</label>
            <input id="authPhone" type="tel" placeholder="10 अंकों का नंबर" maxlength="10">
          </div>
          <div class="field">
            <label>पासवर्ड</label>
            <input id="authPass" type="password" placeholder="कम से कम 4 अक्षर">
          </div>
          <div id="regExtra" class="hidden">
            <div class="field">
              <label>आपका नाम</label>
              <input id="authName" placeholder="पूरा नाम">
            </div>
          </div>
          <button id="authBtn" class="btn btn-primary" onclick="doAuth()">अकाउंट बनाएं</button>
          <p style="text-align:center;margin-top:12px">
            <button class="link-btn" onclick="showForgot()">पासवर्ड भूल गए?</button>
          </p>
        </div>

        <div id="authForgot" class="hidden">
          <p class="small" style="margin-bottom:12px">नया पासवर्ड सेट करें।</p>
          <div class="field"><label>मोबाइल नंबर</label><input id="forgotPhone" type="tel" maxlength="10"></div>
          <div class="field"><label>नया पासवर्ड</label><input id="forgotPass" type="password"></div>
          <button class="btn btn-primary" onclick="doForgot()">पासवर्ड रीसेट करें</button>
          <p style="text-align:center;margin-top:12px"><button class="link-btn" onclick="hideForgot()">← वापस</button></p>
        </div>
      </div>
    </div>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <div class="user-bar">
      <span id="userInfo">👋</span>
      <button class="btn btn-secondary btn-sm" onclick="appLogout()">लॉगआउट</button>
    </div>
    <div class="card">
      <h2>👋 स्वागत है</h2>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="show('create')">➕ नई कमेटी</button>
      </div>
    </div>
    <div class="card">
      <h2>🔑 Access Code डालें</h2>
      <div class="field"><input id="accessCode" placeholder="Member Access Code"></div>
      <button class="btn btn-primary" onclick="join()">प्रवेश करें</button>
    </div>
  </section>

  <!-- MY LIST -->
  <section id="mylist" class="hidden">
    <div class="card">
      <h2>📋 मेरी कमेटियाँ</h2>
      <div id="bcList"></div>
    </div>
  </section>

  <!-- CREATE -->
  <section id="create" class="hidden">
    <div class="card">
      <h2>➕ नई कमेटी</h2>
      <div class="field"><label>कमेटी का नाम</label><input id="bcName" placeholder="जैसे: गांव कमेटी"></div>
      <div class="row">
        <div class="field"><label>किस्त राशि (₹)</label><input id="bcAmount" type="number"></div>
        <div class="field"><label>प्रकार</label><select id="freq"><option value="monthly">मासिक</option></select></div>
      </div>
      <div class="row">
        <div class="field"><label>शुरुआत तिथि</label><input id="startDate" type="date"></div>
        <div class="field"><label>मालिक का नाम</label><input id="ownerName"></div>
      </div>
    </div>
    <div class="card">
      <h2>👥 सदस्य जोड़ें</h2>
      <div class="row">
        <div class="field"><input id="memberCount" type="number" placeholder="सदस्य संख्या"></div>
        <button class="btn btn-secondary" onclick="buildMemberInputs()">नाम बॉक्स बनाएं</button>
      </div>
      <div id="memberInputs"></div>
    </div>
    <button class="btn btn-primary" onclick="createBC()" style="margin-bottom:14px" id="createBtn">✅ कमेटी बनाएं</button>
    <div id="created" class="card hidden"></div>
  </section>

  <!-- DASHBOARD -->
  <section id="dashboard" class="hidden">
    <div class="card">
      <h2 id="dashTitle">Dashboard</h2>
      <div id="dash">Loading...</div>
    </div>
    <div class="card">
      <h2>👥 सदस्य</h2>
      <div id="members"></div>
    </div>
    <div class="card">
      <h2>⚠️ बकाया चेतावनी</h2>
      <div id="warnings"></div>
    </div>
  </section>
</main>

<nav id="mainNav" class="bottom-nav hidden">
  <button id="nav-home" onclick="show('home')"><span class="ico">🏠</span>होम</button>
  <button id="nav-mylist" onclick="show('mylist')"><span class="ico">📋</span>लिस्ट</button>
  <button id="nav-create" onclick="show('create')"><span class="ico">➕</span>नई</button>
</nav>

<script>
// ✨ YAHAN AAPKA NAYA CLOUDFLARE API LINK HAI ✨
const API_URL = 'https://withered-base-4632.ashifmd400.workers.dev';

const KEYS = { session: 'kk_session', joined: 'kk_joined', current: 'kk_current' };

function load(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch { return def; } }
function save(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function appAlert(text) {
  return new Promise(res => {
    const m = document.getElementById('appModal');
    document.getElementById('modalText').textContent = text;
    document.getElementById('modalBtns').innerHTML = '<button class="btn btn-primary" id="modalOk">OK</button>';
    m.classList.remove('hidden');
    document.getElementById('modalOk').onclick = () => { m.classList.add('hidden'); res(); };
  });
}

function genCode() { return Math.random().toString(36).substring(2, 10).toUpperCase(); }

function switchAuth(mode) {
  const isReg = mode === 'register';
  document.getElementById('tabReg').classList.toggle('active', isReg);
  document.getElementById('tabLogin').classList.toggle('active', !isReg);
  document.getElementById('regExtra').classList.toggle('hidden', !isReg);
  document.getElementById('authBtn').textContent = isReg ? 'अकाउंट बनाएं' : 'लॉगिन करें';
  document.getElementById('authMsg').innerHTML = '';
  hideForgot();
}
function showForgot() { document.getElementById('authNormal').classList.add('hidden'); document.getElementById('authForgot').classList.remove('hidden'); document.getElementById('authTabs').classList.add('hidden'); }
function hideForgot() { document.getElementById('authNormal').classList.remove('hidden'); document.getElementById('authForgot').classList.add('hidden'); document.getElementById('authTabs').classList.remove('hidden'); }

async function doAuth() {
  const phone = document.getElementById('authPhone').value;
  const pass = document.getElementById('authPass').value;
  const name = document.getElementById('authName').value;
  const isReg = document.getElementById('tabReg').classList.contains('active');
  const msg = document.getElementById('authMsg');
  const btn = document.getElementById('authBtn');

  if(phone.length !== 10) return msg.innerHTML = '<div class="msg err">सही 10 अंकों का नंबर डालें</div>';
  
  btn.textContent = "Loading...";
  try {
    const res = await fetch(`${API_URL}/api/auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, pass, name, isRegister: isReg })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Error");
    
    save(KEYS.session, { phone, name: data.user.name });
    msg.innerHTML = '<div class="msg ok">सफलतापूर्वक हो गया!</div>';
    setTimeout(enterApp, 1000);
  } catch(e) {
    msg.innerHTML = `<div class="msg err">${e.message}</div>`;
  }
  btn.textContent = isReg ? 'अकाउंट बनाएं' : 'लॉगिन करें';
}

async function doForgot() {
  const phone = document.getElementById('forgotPhone').value;
  const pass = document.getElementById('forgotPass').value;
  try {
    const res = await fetch(`${API_URL}/api/forgot`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, newPass: pass })
    });
    if(!res.ok) throw new Error("Number not found");
    appAlert("पासवर्ड बदल गया। अब लॉगिन करें।");
    hideForgot(); switchAuth('login');
  } catch(e) { appAlert("त्रुटि: " + e.message); }
}

function enterApp() {
  const s = load(KEYS.session, null);
  if(!s) return;
  document.getElementById('auth').classList.add('hidden');
  document.getElementById('mainNav').classList.remove('hidden');
  document.getElementById('userInfo').textContent = '👋 ' + s.name;
  show('home');
}
function appLogout() { localStorage.removeItem(KEYS.session); location.reload(); }

function show(id) {
  document.querySelectorAll('main > section').forEach(x => x.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  ['home','mylist','create'].forEach(n => {
    const b = document.getElementById('nav-'+n);
    if(b) b.classList.toggle('active', n === id);
  });
  if(id === 'dashboard') loadDash();
  if(id === 'mylist') renderMyList();
  window.scrollTo(0,0);
}

function buildMemberInputs() {
  const c = Number(document.getElementById('memberCount').value) || 0;
  let h = '';
  for(let i=1; i<=c; i++) h += `<div class="mem-row"><span class="num">${i}</span><input class="mem-name" placeholder="नाम"></div>`;
  document.getElementById('memberInputs').innerHTML = h;
}

async function createBC() {
  const name = document.getElementById('bcName').value;
  const amount = document.getElementById('bcAmount').value;
  const ownerName = document.getElementById('ownerName').value;
  const inps = document.querySelectorAll('.mem-name');
  let members = [];
  inps.forEach(i => { if(i.value.trim()) members.push({ name: i.value.trim(), paid: false }); });
  
  if(!name || !amount || members.length===0) return appAlert('कृपया सभी जानकारी और सदस्य भरें');
  
  if(!members.some(m => m.name === ownerName)) members.unshift({ name: ownerName, paid: true });

  const code = genCode();
  const bcData = { code, name, amount, ownerName, members, startDate: document.getElementById('startDate').value };
  
  document.getElementById('createBtn').textContent = "Saving...";
  try {
    await fetch(`${API_URL}/api/bcs`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(bcData)
    });
    
    let joined = load(KEYS.joined, []);
    joined.push(code); save(KEYS.joined, joined);
    save(KEYS.current, code);
    
    document.getElementById('created').classList.remove('hidden');
    document.getElementById('created').innerHTML = `<h2>✅ बन गई!</h2><div class="code">${code}</div><p>यह Access Code सदस्यों को दें।</p><button class="btn btn-primary" onclick="show('dashboard')">Dashboard देखें</button>`;
  } catch(e) { appAlert("Error saving database"); }
  document.getElementById('createBtn').textContent = "✅ कमेटी बनाएं";
}

async function join() {
  const code = document.getElementById('accessCode').value.trim().toUpperCase();
  if(!code) return;
  try {
    const res = await fetch(`${API_URL}/api/bcs?code=${code}`);
    if(!res.ok) throw new Error();
    let joined = load(KEYS.joined, []);
    if(!joined.includes(code)) { joined.push(code); save(KEYS.joined, joined); }
    save(KEYS.current, code);
    document.getElementById('accessCode').value = '';
    show('dashboard');
  } catch(e) { appAlert("गलत Code! कमेटी नहीं मिली।"); }
}

async function renderMyList() {
  const codes = load(KEYS.joined, []);
  let html = '';
  for(let c of codes) {
    try {
      let res = await fetch(`${API_URL}/api/bcs?code=${c}`);
      if(res.ok) {
        let d = await res.json();
        let bc = d.data;
        html += `<div class="bc-item" onclick="save(KEYS.current, '${bc.code}'); show('dashboard')">
          <b>${bc.name}</b> <span class="small">Code: ${bc.code}</span>
        </div>`;
      }
    } catch(e) {}
  }
  document.getElementById('bcList').innerHTML = html || '<p class="empty-state">कोई कमेटी नहीं है</p>';
}

async function loadDash() {
  const code = load(KEYS.current, null);
  document.getElementById('dashTitle').textContent = "Loading...";
  try {
    const res = await fetch(`${API_URL}/api/bcs?code=${code}`);
    const d = await res.json();
    const bc = d.data;
    
    document.getElementById('dashTitle').textContent = '📊 ' + bc.name;
    document.getElementById('dash').innerHTML = `<p>Code: <b>${bc.code}</b> | किस्त: ₹${bc.amount}</p>`;
    
    document.getElementById('members').innerHTML = bc.members.map((m,i) => 
      `<div class="member"><b>${i+1}. ${m.name}</b><span class="tag ${m.paid?'paid':'due'}">${m.paid?'भुगतान':'बाकी'}</span></div>`
    ).join('');
    
    const unpaid = bc.members.filter(m => !m.paid);
    document.getElementById('warnings').innerHTML = unpaid.length ? unpaid.map(m => 
      `<div class="warn">⚠️ ${m.name} का बाकी है 
        <button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="markPaid('${bc.code}','${m.name}')">भुगतान ✓</button>
      </div>`
    ).join('') : '<div class="ok">सब ठीक है! कोई बकाया नहीं।</div>';
  } catch(e) { appAlert("डेटा लोड नहीं हो पाया"); }
}

async function markPaid(code, memberName) {
  try {
    await fetch(`${API_URL}/api/pay`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, memberName })
    });
    loadDash();
  } catch(e) { appAlert("अपडेट नहीं हो पाया"); }
}

window.onload = () => {
  const s = load(KEYS.session, null);
  document.getElementById('startDate').value = new Date().toISOString().slice(0,10);
  if(s) { enterApp(); } else { document.getElementById('auth').classList.remove('hidden'); switchAuth('register'); }
};
</script>
</body>
</html>
