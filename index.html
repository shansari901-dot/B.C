<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worker Management Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f6ff;
padding-bottom:80px;
}

header{
background:linear-gradient(135deg,#4f46e5,#2563eb);
color:#fff;
padding:20px;
text-align:center;
border-radius:0 0 20px 20px;
}

.container{
max-width:1000px;
margin:auto;
padding:15px;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-top:15px;
box-shadow:0 3px 12px rgba(0,0,0,.10);
}

input,button,select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
}

button{
background:#4f46e5;
color:white;
border:none;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#3730a3;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.worker{
border:1px solid #ddd;
padding:12px;
border-radius:12px;
margin-top:10px;
}

.hidden{
display:none;
}

img{
max-width:100px;
margin-top:10px;
border-radius:10px;
}

.stat{
background:#eef2ff;
padding:15px;
text-align:center;
border-radius:12px;
}

.stat h3{
font-size:24px;
color:#4f46e5;
}

@media(max-width:700px){
.grid{
grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<header>
<h1>👷 Worker Management Portal</h1>
<p>Admin & Worker Dashboard</p>
</header>

<div class="container">

<div class="card">
<h2>🔐 Admin Login</h2>

<input id="adminUser" placeholder="Username">
<input id="adminPass" type="password" placeholder="Password">

<button onclick="adminLogin()">Login</button>

<p style="margin-top:10px;">
Default Login: <b>admin</b> / <b>12345</b>
</p>
</div>

<div id="dashboard" class="hidden">

<div class="card">
<h2>📊 Dashboard</h2>

<div class="grid">
<div class="stat">
<h3 id="totalWorkers">0</h3>
<p>Total Workers</p>
</div>

<div class="stat">
<h3 id="totalAttendance">0</h3>
<p>Total Attendance</p>
</div>
</div>

</div>

<div class="card">

<h2>➕ Register Worker</h2>

<input id="name" placeholder="Worker Name">

<input id="father" placeholder="Father Name">

<input id="mobile" placeholder="Mobile Number">

<input id="aadhaar" placeholder="Aadhaar Number">

<input id="salary" placeholder="Monthly Salary">

<input id="work" placeholder="Work Type">

<input id="photo" type="file" accept="image/*">

<button onclick="registerWorker()">
Register Worker
</button>

</div>

<div class="card">

<h2>🔍 Search Worker</h2>

<input id="search" placeholder="Search Worker" onkeyup="loadWorkers()">

</div>

<div class="card">

<h2>👥 Worker List</h2>

<div id="workerList"></div>

</div>

</div>

</div>

<script>

function adminLogin(){

let u=document.getElementById("adminUser").value;
let p=document.getElementById("adminPass").value;

if(u==="admin" && p==="12345"){

document.getElementById("dashboard")
.classList.remove("hidden");

loadWorkers();

alert("Login Successful");

}else{
alert("Wrong Username or Password");
}

}

function registerWorker(){

let file=document.getElementById("photo").files[0];

let reader=new FileReader();

reader.onload=function(){

let workers=
JSON.parse(localStorage.getItem("workers")||"[]");

let worker={

id:"W"+Date.now(),

name:document.getElementById("name").value,

father:document.getElementById("father").value,

mobile:document.getElementById("mobile").value,

aadhaar:document.getElementById("aadhaar").value,

salary:document.getElementById("salary").value,

work:document.getElementById("work").value,

attendance:0,

photo:reader.result

};

workers.push(worker);

localStorage.setItem(
"workers",
JSON.stringify(workers)
);

alert(
"Worker Registered\nID: "+worker.id
);

loadWorkers();

};

if(file){
reader.readAsDataURL(file);
}else{
reader.onload();
}

}

function loadWorkers(){

let workers=
JSON.parse(localStorage.getItem("workers")||"[]");

let search=
document.getElementById("search")?.value?.toLowerCase()||"";

workers=workers.filter(w=>
w.name.toLowerCase().includes(search)
);

let html="";

let totalAttendance=0;

workers.forEach(w=>{

totalAttendance+=Number(w.attendance);

html+=`

<div class="worker">

${w.photo?
`<img src="${w.photo}">`
:""}

<h3>${w.name}</h3>

<p><b>ID:</b> ${w.id}</p>

<p><b>Father:</b> ${w.father}</p>

<p><b>Mobile:</b> ${w.mobile}</p>

<p><b>Aadhaar:</b> ${w.aadhaar}</p>

<p><b>Salary:</b> ₹${w.salary}</p>

<p><b>Work:</b> ${w.work}</p>

<p><b>Attendance:</b> ${w.attendance}</p>

<button onclick="markAttendance('${w.id}')">
✅ Present
</button>

<button onclick="deleteWorker('${w.id}')"
style="background:red;margin-top:5px;">
🗑 Delete
</button>

</div>

`;

});

document.getElementById("workerList")
.innerHTML=html;

document.getElementById("totalWorkers")
.innerText=workers.length;

document.getElementById("totalAttendance")
.innerText=totalAttendance;

}

function markAttendance(id){

let workers=
JSON.parse(localStorage.getItem("workers")||"[]");

workers=workers.map(w=>{

if(w.id===id){
w.attendance++;
}

return w;

});

localStorage.setItem(
"workers",
JSON.stringify(workers)
);

loadWorkers();

}

return;
}
